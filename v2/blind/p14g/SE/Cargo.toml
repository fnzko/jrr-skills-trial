[package]
name = "miniq"
version = "0.1.0"
edition = "2024"
description = "A small in-memory message queue driven by JSON lines on stdin"

[dependencies]
serde = { version = "1", features = ["derive"] }
# arbitrary_precision keeps the written text of numbers, so that "-0" is still an integer.
serde_json = { version = "1", features = ["arbitrary_precision"] }

[lints.rust]
unsafe_code = "forbid"
