[package]
name = "miniq"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
# arbitrary_precision keeps huge or exponent-form numbers parseable, so they
# are rejected as parameter values instead of as malformed requests.
serde_json = { version = "1", features = ["arbitrary_precision"] }
